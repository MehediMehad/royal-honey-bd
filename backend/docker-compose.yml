version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: royal_honey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: royal_honey_user
      POSTGRES_PASSWORD: royal_honey_password
      POSTGRES_DB: royal_honey_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U royal_honey_user -d royal_honey_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: royal_honey_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
