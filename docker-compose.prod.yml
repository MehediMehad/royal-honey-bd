services:
  postgres:
    image: postgres:16-alpine
    container_name: royal_honey_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Mehedi0610}
      POSTGRES_DB: ${POSTGRES_DB:-royal_honey_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d royal_honey_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - royal_honey_net

  redis:
    image: redis:7-alpine
    container_name: royal_honey_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - royal_honey_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royal_honey_prod_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Mehedi0610}@postgres:5432/${POSTGRES_DB:-royal_honey_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@royalhoneybd.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - royal_honey_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royal_honey_prod_worker
    restart: always
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Mehedi0610}@postgres:5432/${POSTGRES_DB:-royal_honey_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - royal_honey_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: royal_honey_prod_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:5000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://api:5000
    depends_on:
      - api
    networks:
      - royal_honey_net

networks:
  royal_honey_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
